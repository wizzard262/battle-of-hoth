		<meta name="keywords" content="battle of hoth, Lego, 3866, Star Wars, HTML5 game, board game, phaser game, lego game"/>

		<meta property="og:title" content="Battle of Hoth">

		<style type="text/css">
			body {
				margin: 0px 0px 1px 0px; /* the extra 1px allows the iOS inner/outer check to work */
				background: #666666;
				font-family: Arial;
				font-size: 30px;
				color: #15155E;
			}

			#loader {
				background: #FFFFFF;
			}
			.layer {
				width: 100%;
				height: 100%;
				position: absolute;
				top: 0;
				left: 0;
				text-align: center;
			}

                width: 29px;
                position: relative;
                top: 2px;
            }
            .hothset {
                max-height:50%;
                max-width:100%;
            }
		</style>

	<body>
		<div id="loader" class="layer">
			<h3>BATTLE OF H<img src="assets/images/loading.gif" class="loader" alt="O"/>TH</h3>
            <img src="assets/images/3866.jpg" alt="Lego Star Wars 3866 Battle of Hoth board game set" class="hothset" />
		</div>
